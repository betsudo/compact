name: Ledger 9 secondary keyword originals / native Linux

on:
  push:
    branches:
      - 'codex/ledger9-keyword-secondary-linux/*'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA selected for this qualification
        type: string
        required: true

permissions: {}
env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PYTHONDONTWRITEBYTECODE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    name: Exact signed source and gate graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require explicitly selected exact commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            test "$SOURCE_REF" = "refs/heads/codex/ledger9-keyword-secondary-linux/$SOURCE_SHA"
            EXPECTED_SHA="$SOURCE_SHA"
          else
            test "$EVENT_NAME" = workflow_dispatch
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$SOURCE_SHA"
      - name: Checkout exact source and pinned upstream history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned upstream comparison commit
        run: git fetch --no-tags --depth=1 https://github.com/LFDT-Minokawa/compact.git 672bd0f226f47a7d036c5c074ce71fbe1af1925e
      - name: Trust pinned public signing key
        run: bash .github/scripts/trust_vector_source_key.sh
      - name: Refuse source, SDK, or workflow drift
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git verify-commit HEAD
          git cat-file -e '672bd0f226f47a7d036c5c074ce71fbe1af1925e^{commit}'
          git log -1 --format=%B | grep -q '^Signed-off-by: '
          git log -1 --format=%B | grep -q '^Assisted-by: AI$'
          python3 -B .github/scripts/test_compiler_closure.py
          python3 -B .github/scripts/test_keyword_secondary_linux_workflow.py
          python3 -B - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/compact-rust-backend')
          from check_release_packages import compatibility_record
          assert compatibility_record()['ledger_version'] == 'ledger-9.1.0.1'
          assert json.loads(Path('runtime/package.json').read_text())['version'] == '0.18.0'
          PY

  compiler-linux:
    needs: source-preflight
    uses: ./.github/workflows/compiler-producer.yml
    permissions:
      contents: read
    with:
      system: x86_64-linux
      export-shell: true

  secondary-semantics:
    name: Secondary keyword generated parity, host and proof
    needs: [source-preflight, compiler-linux]
    if: ${{ !cancelled() && needs.source-preflight.result == 'success' && needs.compiler-linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful same-run compiler producer
        env:
          PRODUCER_RESULT: ${{ needs.compiler-linux.result }}
          COMPILER_ARTIFACT: ${{ needs.compiler-linux.outputs.artifact-id }}
          SHELL_ARTIFACT: ${{ needs.compiler-linux.outputs.shell-artifact-id }}
          PRODUCER_ATTEMPT: ${{ needs.compiler-linux.outputs.producer-attempt }}
        run: |
          set -euo pipefail
          test "$PRODUCER_RESULT" = success
          test -n "$COMPILER_ARTIFACT"
          test -n "$SHELL_ARTIFACT"
          test -n "$PRODUCER_ATTEMPT"
      - name: Checkout exact source and pinned upstream history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned upstream comparison commit
        run: git fetch --no-tags --depth=1 https://github.com/LFDT-Minokawa/compact.git 672bd0f226f47a7d036c5c074ce71fbe1af1925e
      - name: Trust pinned public signing key
        run: bash .github/scripts/trust_vector_source_key.sh
      - name: Setup Nix
        uses: ./.github/actions/setup-nix-cache
        with:
          attic_token: ${{ secrets.ATTIC_CACHE_TOKEN }}
          free_disk: 'true'
      - name: Import authenticated same-run compiler closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ needs.compiler-linux.outputs.artifact-id }}
          PRODUCER_ATTEMPT: ${{ needs.compiler-linux.outputs.producer-attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git verify-commit HEAD
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/keyword-secondary-compiler-material.zip"
          compiler=$(python3 -B .github/scripts/compiler_closure.py import \
            --source-sha "$SOURCE_SHA" --system x86_64-linux \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "$PRODUCER_ATTEMPT" \
            --repository "$REPOSITORY" --artifact-id "$ARTIFACT_ID" \
            --artifact-zip "$RUNNER_TEMP/keyword-secondary-compiler-material.zip" \
            --directory "$RUNNER_TEMP/keyword-secondary-imported-compiler")
          echo "COMPACTC=$compiler/bin/compactc" >> "$GITHUB_ENV"
      - name: Import authenticated same-run compiler shell
        uses: ./.github/actions/import-compiler-shell
        with:
          artifact-id: ${{ needs.compiler-linux.outputs.shell-artifact-id }}
          producer-attempt: ${{ needs.compiler-linux.outputs.producer-attempt }}
      - name: Setup locked Rust 1.99 toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)
        with:
          toolchain: 1.99.0
      - name: Setup Python for semantic gates
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.13
      - name: Restore locked Cargo downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-
      - name: Resolve exact-head Runtime 0.18 and compiler recipe
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cargo fetch --locked
          nix build --no-link .#runtime.package
          runtime_store=$(nix eval --offline --raw .#runtime.package.outPath)
          runtime="$runtime_store/lib/node_modules/@midnight-ntwrk/compact-runtime"
          test -f "$runtime/dist/index.js"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$runtime/package.json")" = 0.18.0
          printf 'SECONDARY_RUNTIME=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'SECONDARY_CARGO_TARGET=%s/keyword-secondary-shared-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          zkir_store=$(nix build --no-link --print-out-paths .#zkir-v3)
          test -x "$zkir_store/bin/zkir"
          printf 'SECONDARY_ZKIR=%s/bin/zkir\n' "$zkir_store" >> "$GITHUB_ENV"
          python3 -B tools/compact-rust-backend/record_compiler_recipe.py \
            --compiler "$COMPACTC" --output "$RUNNER_TEMP/keyword-secondary-compiler-recipe"
      - name: Run six original keyword families serially
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          mkdir -p "$SECONDARY_CARGO_TARGET"
          for gate in include prefix assert module export import_type; do
            arguments=(--compiler "$COMPACTC" \
              --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
              --output "$RUNNER_TEMP/keyword-secondary-semantic-evidence/$gate")
            arguments+=(--ts-runtime "$SECONDARY_RUNTIME" \
              --cargo-target "$SECONDARY_CARGO_TARGET")
            checker="tools/compact-rust-backend/check_upstream_ledger9_${gate}_keywords.py"
            env -u LD_LIBRARY_PATH nix develop .#compiler --command \
              python3 -X faulthandler -u \
              "$checker" "${arguments[@]}" \
              | tee "$RUNNER_TEMP/keyword-secondary-semantic-evidence/$gate.stdout.log"
          done
      - name: Run pinned small keyword families and constructor Rust result
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u tools/compact-rust-backend/check_upstream_ledger9_small_keywords.py \
              --compiler "$COMPACTC" \
              --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
              --ts-runtime "$SECONDARY_RUNTIME" \
              --cargo-target "$SECONDARY_CARGO_TARGET" \
              --output "$root/small_keywords" | tee "$root/small_keywords.stdout.log"
      - name: Run circuit, pure and disclose original keyword gates serially
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          for gate in circuit pure disclose; do
            env -u LD_LIBRARY_PATH nix develop .#compiler --command \
              python3 -X faulthandler -u \
              "tools/compact-rust-backend/check_upstream_ledger9_${gate}_keywords.py" \
              --compiler "$COMPACTC" \
              --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
              --ts-runtime "$SECONDARY_RUNTIME" \
              --cargo-target "$SECONDARY_CARGO_TARGET" \
              --output "$root/$gate" | tee "$root/$gate.stdout.log"
          done
      - name: Run Bytes indexed and static controls serially
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u tools/compact-rust-backend/check_upstream_ledger9_bytes_indexed_access.py \
              --compiler "$COMPACTC" \
              --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
              --ts-runtime "$SECONDARY_RUNTIME" \
              --cargo-target "$SECONDARY_CARGO_TARGET" \
              --output "$root/bytes_indexed" | tee "$root/bytes_indexed.stdout.log"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u tools/compact-rust-backend/check_static_bytes_fold_index_domain.py \
              --compiler "$COMPACTC" --output "$root/bytes_static" \
              | tee "$root/bytes_static.stdout.log"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            scheme --program compiler/test-rust-vector-indices.ss "$root/bytes-occurrences" \
              | tee "$root/bytes-occurrences.stdout.log"
      - name: Run all 263 original twenty-family host tests
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u tools/compact-rust-backend/stage_upstream_keyword_vitest_host.py \
              --runtime "$SECONDARY_RUNTIME" --output "$root/host-stage" \
              | tee "$root/host-stage.stdout.log"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u tools/compact-rust-backend/check_upstream_keyword_vitest_host.py \
              --stage "$root/host-stage" --compiler "$COMPACTC" \
              --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
              --output "$root/host" | tee "$root/host.stdout.log"
      - name: Prove and strictly apply import ledger field transaction
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          export MIDNIGHT_PP="$RUNNER_TEMP/keyword-secondary-proof-parameters"
          mkdir -p "$MIDNIGHT_PP"
          CARGO_TARGET_DIR="$SECONDARY_CARGO_TARGET" cargo run \
            --profile proof-checks --locked --offline -p compact-rust-proof-smoke -- \
            --prepare-proof-material --parameter-k 6 --parameter-k 7 --parameter-k 8 \
            > "$root/proof-material.json"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u \
            tools/compact-rust-backend/check_upstream_ledger9_import_ledger_field_proof.py \
            --import-type-gate "$root/import_type" --zkir "$SECONDARY_ZKIR" \
            --output "$root/import_proof" --expected-source-sha "$GITHUB_SHA" \
            --cargo-target "$SECONDARY_CARGO_TARGET" \
            | tee "$root/import_proof.stdout.log"
      - name: Prove and strictly apply indexed Bytes transaction
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          export MIDNIGHT_PP="$RUNNER_TEMP/keyword-secondary-proof-parameters"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u \
            tools/compact-rust-backend/check_upstream_ledger9_bytes_indexed_access_proof.py \
            --bytes-gate "$root/bytes_indexed" --zkir "$SECONDARY_ZKIR" \
            --output "$root/bytes_proof" --expected-source-sha "$GITHUB_SHA" \
            --cargo-target "$SECONDARY_CARGO_TARGET" \
            | tee "$root/bytes_proof.stdout.log"
      - name: Prove and strictly apply constructor parameters transaction
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          export MIDNIGHT_PP="$RUNNER_TEMP/keyword-secondary-proof-parameters"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u \
            tools/compact-rust-backend/check_upstream_ledger9_keyword_constructor_parameters_proof.py \
            --grouped-gate "$root/small_keywords" --compiler "$COMPACTC" \
            --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
            --zkir "$SECONDARY_ZKIR" --output "$root/constructor_proof" \
            --expected-source-sha "$GITHUB_SHA" --cargo-target "$SECONDARY_CARGO_TARGET" \
            | tee "$root/constructor_proof.stdout.log"
      - name: Prove and strictly apply two disclose transactions serially
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keyword-secondary-semantic-evidence"
          export MIDNIGHT_PP="$RUNNER_TEMP/keyword-secondary-proof-parameters"
          env -u LD_LIBRARY_PATH nix develop .#compiler --command \
            python3 -X faulthandler -u \
            tools/compact-rust-backend/check_upstream_ledger9_disclose_proofs.py \
            --disclose-gate "$root/disclose" --compiler "$COMPACTC" \
            --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
            --zkir "$SECONDARY_ZKIR" --output "$root/disclose_proofs" \
            --expected-source-sha "$GITHUB_SHA" --cargo-target "$SECONDARY_CARGO_TARGET" \
            | tee "$root/disclose_proofs.stdout.log"
      - name: Verify retained source, generated artifacts and proof receipts
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -B .github/scripts/verify_keyword_secondary_linux_receipts.py \
            --all "$RUNNER_TEMP/keyword-secondary-semantic-evidence" \
            --source-sha "$SOURCE_SHA" --compiler "$COMPACTC" \
            --compiler-recipe "$RUNNER_TEMP/keyword-secondary-compiler-recipe/receipt.json" \
            --runtime "$SECONDARY_RUNTIME" --zkir "$SECONDARY_ZKIR" \
            --summary "$RUNNER_TEMP/keyword-secondary-semantic-evidence/summary.json"
      - name: Upload exact-head keyword-secondary qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger9-keyword-secondary-linux-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/keyword-secondary-compiler-recipe/
            ${{ runner.temp }}/keyword-secondary-semantic-evidence/
            !${{ runner.temp }}/keyword-secondary-semantic-evidence/**/node_modules/**
            !${{ runner.temp }}/keyword-secondary-semantic-evidence/**/.yarn/**
            !${{ runner.temp }}/keyword-secondary-semantic-evidence/**/target/**
            !${{ runner.temp }}/keyword-secondary-semantic-evidence/**/rust-target/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  complete:
    name: Ledger 9 secondary keyword native Linux qualification
    runs-on: ubuntu-latest
    needs: [source-preflight, compiler-linux, secondary-semantics]
    if: ${{ always() }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every keyword-secondary qualification owner
        env:
          PREFLIGHT_RESULT: ${{ needs.source-preflight.result }}
          PRODUCER_RESULT: ${{ needs.compiler-linux.result }}
          SECONDARY_RESULT: ${{ needs.secondary-semantics.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT_RESULT" = success
          test "$PRODUCER_RESULT" = success
          test "$SECONDARY_RESULT" = success
