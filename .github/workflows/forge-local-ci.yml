# Optional proof lane. The required Rust AST gate does not depend on Forge.
name: Forge circuit qualification

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Consumer to qualify (Linux candidate does not publish caches)
        type: choice
        options: [apple, linux-candidate, linux-native, linux-owner]
        default: apple
        required: true
      native-snapshot-key:
        description: Exact existing cache primary key (linux-owner only; no prefix fallback)
        type: string
        required: false
        default: ''
      native-snapshot-id:
        description: Externally authenticated expected stopped snapshot SHA256
        type: string
        required: false
        default: ''
      native-snapshot-partition:
        description: Externally authenticated expected compatibility partition SHA256
        type: string
        required: false
        default: ''
      native-seed-publish:
        description: Explicit one-seed feature-branch pilot; requires an approved single-writer window
        type: boolean
        required: false
        default: false
      native-seed-window:
        description: Owner-approved operational window label; not global quota enforcement
        type: string
        required: false
        default: ''
  push:
    branches: [codex/rust-backend-ast]
    paths:
      - 'compiler/**'
      - 'third_party/compiler/**'
      - 'srcMaps/**'
      - 'runtime/**'
      - 'test-center/**'
      - 'runtime-rs/**'
      - 'runtime-rs-macros/**'
      - 'testkit-rs/**'
      - 'tools/compact-rust-backend/**'
      - 'tools/compact-rust-proof-smoke/**'
      - 'tests-rust-backend/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - '_sources/**'
      - 'nix/**'
      - '.github/actions/**'
      - '.github/workflows/forge-local-ci.yml'
      - '.github/scripts/**'
      - '.github/workflows/compiler-producer.yml'
      - '.github/workflows/build-compiler.yml'

  workflow_call:
    inputs:
      compiler-artifact-id:
        description: Exact same-run Darwin producer artifact ID
        required: true
        type: string
      compiler-producer-result:
        description: Caller producer result; a failed/missing producer never rebuilds here
        required: true
        type: string

      compiler-producer-attempt:
        description: Actual successful producer attempt, not the current consumer rerun attempt
        required: true
        type: string
permissions: {}
concurrency:
  group: forge-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  snapshot-inputs:
    name: Validate optional native snapshot inputs
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      restore-requested: ${{ steps.validate.outputs.restore-requested }}
    steps:
      - name: Validate complete external snapshot tuple before producers
        id: validate
        env:
          QUALIFICATION: ${{ inputs.qualification }}
          SNAPSHOT_KEY: ${{ inputs.native-snapshot-key }}
          SNAPSHOT_ID: ${{ inputs.native-snapshot-id }}
          SNAPSHOT_PARTITION: ${{ inputs.native-snapshot-partition }}
          EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          SEED_PUBLISH: ${{ inputs.native-seed-publish }}
          SEED_WINDOW: ${{ inputs.native-seed-window }}
        run: |
          python3 - <<'PY_SNAPSHOT'
          import os, re
          key, identity, partition = (os.environ[name] for name in ('SNAPSHOT_KEY', 'SNAPSHOT_ID', 'SNAPSHOT_PARTITION'))
          supplied = [bool(value) for value in (key, identity, partition)]
          publish = os.environ.get('SEED_PUBLISH', '') == 'true'
          approval = os.environ.get('SEED_WINDOW', '')
          if publish:
              if os.environ['EVENT_NAME'] != 'workflow_dispatch' or os.environ['QUALIFICATION'] != 'linux-owner' or os.environ.get('ACTUAL_REF') != 'refs/heads/codex/issue-679-trusted-native-seed':
                  raise SystemExit('publication requires the fixed explicit pilot ref/mode')
              if any(supplied):
                  raise SystemExit('publication cannot accompany supplied restore tuple')
              if not re.fullmatch('[A-Za-z0-9][A-Za-z0-9 .:_-]{0,159}', approval):
                  raise SystemExit('explicit owner single-writer window label required')
          elif approval:
              raise SystemExit('window label requires explicit publication')
          if any(supplied):
              if not all(supplied):
                  raise SystemExit('snapshot key, ID and partition require all three')
              if os.environ['EVENT_NAME'] != 'workflow_dispatch' or os.environ['QUALIFICATION'] != 'linux-owner':
                  raise SystemExit('snapshot restore is limited to explicit linux-owner dispatch')
              if not all(re.fullmatch('[0-9a-f]{64}', value) for value in (identity, partition)):
                  raise SystemExit('snapshot ID and partition must be SHA256')
              match = re.fullmatch(r'forge-v1-([0-9a-f]{64})-([0-9a-f]{64})-([A-Za-z0-9_-]{1,80})', key)
              if match is None or match[1] != partition:
                  raise SystemExit('exact primary key and expected partition disagree')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('restore-requested=' + ('true' if all(supplied) else 'false') + '\n')
          PY_SNAPSHOT

  standalone-darwin-compiler:
    needs: snapshot-inputs
    if: inputs.compiler-producer-result == '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification == 'apple'))
    uses: ./.github/workflows/compiler-producer.yml
    permissions:
      contents: read
    with:
      system: aarch64-darwin

  standalone-linux-compiler:
    needs: snapshot-inputs
    if: github.event_name == 'workflow_dispatch' && (inputs.qualification == 'linux-candidate' || inputs.qualification == 'linux-native' || inputs.qualification == 'linux-owner')
    uses: ./.github/workflows/compiler-producer.yml
    permissions:
      contents: read
    with:
      system: x86_64-linux

  proof:
    needs: [snapshot-inputs, standalone-darwin-compiler]
    name: Forge / Apple Silicon proof qualification
    if: always() && needs.snapshot-inputs.result == 'success' && (inputs.compiler-producer-result != '' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification == 'apple'))
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/forge-proof
    steps:
      - name: Require successful compiler producer
        env:
          PRODUCER_RESULT: ${{ inputs.compiler-producer-result || needs.standalone-darwin-compiler.result }}
          ARTIFACT_ID: ${{ inputs.compiler-artifact-id || needs.standalone-darwin-compiler.outputs.artifact-id }}
          PRODUCER_ATTEMPT: ${{ inputs.compiler-producer-attempt || needs.standalone-darwin-compiler.outputs.producer-attempt }}
        run: |
          test "$PRODUCER_RESULT" = success
          test -n "$ARTIFACT_ID"
          test -n "$PRODUCER_ATTEMPT"
          echo "COMPILER_PRODUCER_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
          echo "COMPILER_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
      - name: Allocate job-local paths
        run: |
          {
            echo "MIDNIGHT_PP=$RUNNER_TEMP/forge-params"
            echo "PLAN=$RUNNER_TEMP/forge-plan"
            echo "SNAPSHOT=$RUNNER_TEMP/forge-restored-snapshot"
            echo "SAVE_SNAPSHOT=$RUNNER_TEMP/forge-save-snapshot"
          } >> "$GITHUB_ENV"
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Nix without private cache credentials
        uses: ./.github/actions/setup-nix-cache
        with:
          skip_cache: 'true'
      - name: Import authenticated same-run compiler closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPOSITORY/actions/artifacts/$COMPILER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/compiler-material.zip"
          compiler=$(python3 .github/scripts/compiler_closure.py import \
            --source-sha "$SOURCE_SHA" --system aarch64-darwin \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "$COMPILER_PRODUCER_ATTEMPT" \
            --repository "$REPOSITORY" --artifact-id "$COMPILER_ARTIFACT_ID" \
            --artifact-zip "$RUNNER_TEMP/compiler-material.zip" \
            --directory "$RUNNER_TEMP/imported-compiler")
          echo "COMPACTC=$compiler/bin/compactc" >> "$GITHUB_ENV"
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.99.0
          components: rustfmt
      - name: Verify formatter required by uncached fixture qualification
        run: rustfmt --version
      - name: Install Python for orchestration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Build pinned public Forge and current compiler
        run: |
          test "$(uname -m)" = arm64
          forge=$(nix build github:betsudo/forge/4ad82c8e1e687b64b7a440679fb8f648358106f0 --no-link --print-out-paths)
          zkir=$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.zkir.packages.aarch64-darwin.zkir' --no-link --print-out-paths)
          {
            echo "FORGE=$forge/bin/midnight-zkir-forge"
            echo "HELPER=$forge/bin/midnight-zkir-forge-ci"
            echo "ZKIR=$zkir/bin/zkir"
          } >> "$GITHUB_ENV"
          echo "$zkir/bin" >> "$GITHUB_PATH"
      - name: Cache dependency downloads separately from circuit material
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: forge-proof-downloads-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock') }}
      - name: Build proof consumer and authenticate official ledger fixtures
        run: |
          cargo build --locked -p compact-rust-proof-smoke
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 -B tools/compact-rust-backend/resolve_ledger_test_static.py \
            --metadata "$RUNNER_TEMP/metadata.json" --lock Cargo.lock \
            --provenance "$RUNNER_TEMP/ledger-provenance.json" --github-env "$GITHUB_ENV"
      - name: Restore public parameters
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.MIDNIGHT_PP }}
          key: forge-public-parameters-${{ hashFiles('tools/compact-rust-backend/forge_ci_qualification.json') }}
      - name: Verify parameters or explicitly acquire through official provider
        run: |
          python3 -B tools/compact-rust-backend/forge_ci.py bootstrap \
            --compiler "$COMPACTC" --forge "$FORGE" --params-dir "$MIDNIGHT_PP" \
            --output "$RUNNER_TEMP/forge-bootstrap" --fetch-params
      - name: Plan exact tool, parameter and workload partition
        id: plan
        run: |
          python3 -B tools/compact-rust-backend/forge_ci.py plan \
            --compiler "$COMPACTC" --forge "$FORGE" --helper "$HELPER" \
            --proof-runner "$CARGO_TARGET_DIR/debug/compact-rust-proof-smoke" \
            --params-dir "$MIDNIGHT_PP" --output "$PLAN" \
            --generation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, pathlib
          keys = json.loads((pathlib.Path(os.environ['PLAN']) / 'key.json').read_text())['restore_keys']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('restore_keys<<FORGE_PREFIXES\n' + '\n'.join(keys) + '\nFORGE_PREFIXES\n')
          PY
      - name: Restore stopped snapshot only
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.SNAPSHOT }}
          key: ${{ steps.plan.outputs.primary }}
          restore-keys: ${{ steps.plan.outputs.restore_keys }}
      - name: Run current circuits, proofs, assertions and uncached qualification
        id: tests
        run: |
          python3 -B tools/compact-rust-backend/forge_ci.py run \
            --plan "$PLAN" --snapshot "$SNAPSHOT" --uncached-zkir "$ZKIR" \
            --max-bytes 268435456
      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PLAN }}/*.json
            ${{ runner.temp }}/forge-bootstrap/*.json
            ${{ runner.temp }}/ledger-provenance.json
          if-no-files-found: warn
          retention-days: 7
      # Workflow event/ref and GitHub cache scopes establish publisher trust.
      # The helper's --tests-passed flag alone is not authorization.
      - name: Prepare bounded trusted snapshot
        id: save
        if: success() && steps.tests.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/codex/rust-backend-ast'
        run: |
          "$HELPER" --binary "$FORGE" prepare-save --key "$PLAN/key.json" \
            --cache-dir "$PLAN/cache" --baseline "$PLAN/baseline.json" \
            --snapshot "$SAVE_SNAPSHOT" --max-bytes 268435456 \
            --trusted-ref refs/heads/codex/rust-backend-ast --tests-passed > "$RUNNER_TEMP/forge-save.json"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'forge-save.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(value['publish']).lower() + '\n')
              if value['publish']:
                  output.write('key=' + value['key'] + '\n')
          PY
      - name: Publish snapshot from successful trusted push
        if: success() && steps.save.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/codex/rust-backend-ast'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.SAVE_SNAPSHOT }}
          key: ${{ steps.save.outputs.key }}

  forge-linux-material:
    needs: snapshot-inputs
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'linux-owner'
    uses: betsudo/forge/.github/workflows/qualify-linux.yml@2614ffd36d7e84f043095b4176eda62f986f264b
    permissions:
      contents: read
    with:
      material-only: true
      producer-source: 2614ffd36d7e84f043095b4176eda62f986f264b

  linux-candidate:
    needs: [snapshot-inputs, standalone-linux-compiler, forge-linux-material]
    name: Forge / Linux candidate qualification
    if: always() && needs.snapshot-inputs.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.qualification == 'linux-candidate' || inputs.qualification == 'linux-native' || inputs.qualification == 'linux-owner')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.qualification == 'linux-native' || inputs.qualification == 'linux-owner') && 240 || 180 }}
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/forge-linux
      FORGE_REF: github:betsudo/forge/d64f52db7239b0ca4891fb0316dca6adb54a5db5
      QUALIFICATION_MODE: ${{ inputs.qualification }}
    steps:
      - name: Require successful compiler producer
        env:
          PRODUCER_RESULT: ${{ needs.standalone-linux-compiler.result }}
          ARTIFACT_ID: ${{ needs.standalone-linux-compiler.outputs.artifact-id }}
          PRODUCER_ATTEMPT: ${{ needs.standalone-linux-compiler.outputs.producer-attempt }}
        run: |
          test "$PRODUCER_RESULT" = success
          test -n "$ARTIFACT_ID"
          test -n "$PRODUCER_ATTEMPT"
          echo "COMPILER_PRODUCER_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
          echo "COMPILER_ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
      - name: Checkout qualification source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout reviewed seed publisher (source only)
        if: inputs.native-seed-publish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: betsudo/forge
          ref: 8e4efdeb2ac905fa73dac7ebd35d82a2119fb24f
          path: artifacts/forge-seed-publisher
          persist-credentials: false
      - name: Prepare Node for reviewed seed publisher
        if: inputs.native-seed-publish
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Install locked publisher dependencies before source planning
        if: inputs.native-seed-publish
        run: env -u NODE_OPTIONS -u NPM_CONFIG_NODE_OPTIONS npm ci --ignore-scripts --prefix artifacts/forge-seed-publisher/.github/actions/native-seed-publish
      - name: Allocate private qualification paths
        run: |
          test "$(uname -m)" = x86_64
          test "$(uname -s)" = Linux
          mkdir "$RUNNER_TEMP/forge-linux-provision"
          {
            echo "MIDNIGHT_PP=$RUNNER_TEMP/forge-linux-params"
            echo "LINUX_PROVISION=$RUNNER_TEMP/forge-linux-provision"
            echo "LINUX_PROOF_RUNNER=$RUNNER_TEMP/forge-linux-provision/proof-smoke"
            echo "LINUX_REPORT=$RUNNER_TEMP/forge-linux-qualification"
            echo "NATIVE_REPORT=$RUNNER_TEMP/forge-linux-native"
          } >> "$GITHUB_ENV"
      - name: Require fresh private snapshot restore destination
        if: needs.snapshot-inputs.outputs.restore-requested == 'true'
        run: test ! -e "$RUNNER_TEMP/forge-linux-supplied-snapshot" && test ! -L "$RUNNER_TEMP/forge-linux-supplied-snapshot"
      - name: Restore exact supplied stopped snapshot (read-only)
        id: native-snapshot
        if: needs.snapshot-inputs.outputs.restore-requested == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/forge-linux-supplied-snapshot
          key: ${{ inputs.native-snapshot-key }}
          fail-on-cache-miss: true
      - name: Require exact supplied cache hit
        if: needs.snapshot-inputs.outputs.restore-requested == 'true'
        env:
          CACHE_HIT: ${{ steps.native-snapshot.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.native-snapshot.outputs.cache-matched-key }}
          EXPECTED_KEY: ${{ inputs.native-snapshot-key }}
        run: |
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$EXPECTED_KEY"
      - name: Setup public Nix without private cache credentials
        uses: ./.github/actions/setup-nix-cache
        with:
          skip_cache: 'true'
      - name: Install exact consumer Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Verify consumer formatter and Clippy before provisioning
        run: |
          rustfmt --version
          cargo clippy --version
      - name: Install Python for qualification
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Check qualification refusal controls
        run: |
          python3 -B -m unittest discover -s tools/compact-rust-backend -p 'test_qualify_linux*.py' -v
      - name: Import authenticated same-run compiler closure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPOSITORY/actions/artifacts/$COMPILER_ARTIFACT_ID/zip" > "$RUNNER_TEMP/compiler-material.zip"
          compiler=$(python3 .github/scripts/compiler_closure.py import \
            --source-sha "$SOURCE_SHA" --system x86_64-linux \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "$COMPILER_PRODUCER_ATTEMPT" \
            --repository "$REPOSITORY" --artifact-id "$COMPILER_ARTIFACT_ID" \
            --artifact-zip "$RUNNER_TEMP/compiler-material.zip" \
            --directory "$RUNNER_TEMP/imported-compiler")
          echo "COMPACTC=$compiler/bin/compactc" >> "$GITHUB_ENV"
      - name: Import authenticated same-run original Forge material
        if: inputs.qualification == 'linux-owner'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MATERIAL_RESULT: ${{ needs.forge-linux-material.result }}
          MATERIAL_ID: ${{ needs.forge-linux-material.outputs.artifact-id }}
          MATERIAL_ATTEMPT: ${{ needs.forge-linux-material.outputs.producer-attempt }}
        run: |
          test "$MATERIAL_RESULT" = success
          test -n "$MATERIAL_ID"
          test -n "$MATERIAL_ATTEMPT"
          gh api "repos/$REPOSITORY/actions/artifacts/$MATERIAL_ID/zip" > "$RUNNER_TEMP/forge-material.zip"
          python3 -B .github/scripts/forge_material.py \
            --repository "$REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-attempt "$MATERIAL_ATTEMPT" --artifact-id "$MATERIAL_ID" \
            --artifact-zip "$RUNNER_TEMP/forge-material.zip" --directory "$RUNNER_TEMP/imported-forge-material" \
            --github-env "$GITHUB_ENV" > "$LINUX_PROVISION/forge-material-import.json"
          cp "$RUNNER_TEMP/imported-forge-material/forge-derivation.json" "$LINUX_PROVISION/forge-derivation.json"
          cp "$RUNNER_TEMP/imported-forge-material/material.json" "$LINUX_PROVISION/forge-material-manifest.json"
          cp "$RUNNER_TEMP/imported-forge-material/store-paths.json" "$LINUX_PROVISION/forge-material-store-paths.json"
          cp "$RUNNER_TEMP/imported-forge-material/flake.json" "$LINUX_PROVISION/forge-flake.json"
      - name: Resolve official ZKIR for the material consumer
        if: inputs.qualification == 'linux-owner'
        run: |
          zkir=$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.zkir.packages.x86_64-linux.zkir' --no-link --print-out-paths --max-jobs 1 --cores 2)
          echo "ZKIR=$zkir/bin/zkir" >> "$GITHUB_ENV"
          echo "$zkir/bin" >> "$GITHUB_PATH"
      - name: Build pinned public Forge, independent Rust compiler and current Compact
        if: inputs.qualification != 'linux-owner'
        run: |
          nix flake metadata "$FORGE_REF" --json > "$LINUX_PROVISION/forge-flake.json"
          forge_source=$(python3 -c 'import json,os; print(json.load(open(os.environ["LINUX_PROVISION"]+"/forge-flake.json"))["path"])')
          # Resolve the same pinned toolchain independently of producer profile output.
          forge_rust=$(nix build --impure --expr '
            let f = builtins.getFlake "github:betsudo/forge/d64f52db7239b0ca4891fb0316dca6adb54a5db5";
                pkgs = import f.inputs.nixpkgs { system = "x86_64-linux"; overlays = [(import f.inputs.rust-overlay)]; };
            in pkgs.rust-bin.stable."1.98.1".minimal.override { extensions = ["rustfmt" "clippy"]; }
          ' --no-link --print-out-paths --max-jobs 1 --cores 2)
          forge=$(nix build "$FORGE_REF" --no-link --print-out-paths --max-jobs 1 --cores 2)
          nix derivation show "$forge" > "$LINUX_PROVISION/forge-derivation.json"
          zkir=$(nix build --impure --expr '(builtins.getFlake (toString ./.)).inputs.zkir.packages.x86_64-linux.zkir' --no-link --print-out-paths --max-jobs 1 --cores 2)
          {
            echo "FORGE=$forge/bin/zkir-forge"
            echo "FORGE_HELPER=$forge/bin/midnight-zkir-forge-ci"
            echo "FORGE_SOURCE=$forge_source"
            echo "FORGE_RUSTC=$forge_rust/bin/rustc"
            echo "ZKIR=$zkir/bin/zkir"
          } >> "$GITHUB_ENV"
          echo "$zkir/bin" >> "$GITHUB_PATH"
      - name: Build real consumer and authenticate locked ledger fixtures
        run: |
          cargo build --profile proof-checks --locked -p compact-rust-proof-smoke
          # Native gates rebuild Cargo's canonical outputs. Qualify these fresh
          # bytes at a private stable path; keep every live identity check active.
          # This runner owns finite/independent uncached smokes; original native
          # gates retain their own source-bound consumer builds.
          install -m 0500 "$CARGO_TARGET_DIR/proof-checks/compact-rust-proof-smoke" "$LINUX_PROOF_RUNNER"
          cmp -- "$CARGO_TARGET_DIR/proof-checks/compact-rust-proof-smoke" "$LINUX_PROOF_RUNNER"
          cargo metadata --locked --format-version 1 > "$LINUX_PROVISION/cargo-metadata.json"
          python3 -B tools/compact-rust-backend/resolve_ledger_test_static.py \
            --metadata "$LINUX_PROVISION/cargo-metadata.json" --lock Cargo.lock \
            --provenance "$LINUX_PROVISION/ledger-provenance.json" --github-env "$GITHUB_ENV"
      - name: Explicitly prepare and verify official proof material
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          runner = pathlib.Path(os.environ['LINUX_PROOF_RUNNER'])
          sizes = ['6', '8']
          if os.environ['QUALIFICATION_MODE'] in ('linux-native', 'linux-owner'):
              config = json.loads(pathlib.Path('tools/compact-rust-backend/forge_native_qualification.json').read_text())
              sizes = sorted(config['parameters'], key=int)
          requested = [item for size in sizes for item in ['--parameter-k', size]]
          for name, flags in [('proof-material', []), ('proof-material-verified', ['--verify-only'])]:
              with (pathlib.Path(os.environ['LINUX_PROVISION']) / (name + '.json')).open('x') as receipt:
                  subprocess.run([str(runner), '--prepare-proof-material', *flags, *requested], stdout=receipt, check=True)
          PY
      - name: Qualify cold, warm, restored, automatic and uncached real consumers
        run: |
          python3 -B tools/compact-rust-backend/qualify_linux_forge.py \
            --compiler "$COMPACTC" --proof-runner "$LINUX_PROOF_RUNNER" \
            --forge "$FORGE" --zkir "$ZKIR" --forge-source "$FORGE_SOURCE" --rustc "$FORGE_RUSTC" \
            --source-manifest tools/compact-rust-backend/forge_linux_source.json \
            --forge-derivation "$LINUX_PROVISION/forge-derivation.json" \
            --params-dir "$MIDNIGHT_PP" --output "$LINUX_REPORT"
      - name: Qualify every original native gate with cold and restored keys
        if: inputs.qualification == 'linux-native'
        run: |
          python3 -B tools/compact-rust-backend/qualify_linux_native.py \
            --qualification-dir "$LINUX_REPORT" \
            --config tools/compact-rust-backend/forge_native_qualification.json \
            --helper "$FORGE_HELPER" --output "$NATIVE_REPORT"
      - name: Measure balanced complete larger contract loops
        if: inputs.qualification == 'linux-owner'
        run: |
          python3 -B tools/compact-rust-backend/compare_forge_contract_loop.py \
            --compiler "$COMPACTC" --proof-runner "$LINUX_PROOF_RUNNER" --forge "$FORGE" \
            --params-dir "$MIDNIGHT_PP" --qualification-dir "$LINUX_REPORT" --helper "$FORGE_HELPER" \
            --output "$RUNNER_TEMP/forge-linux-value-loop"
      - name: Execute the single original native owner after current finite qualification
        id: native-owner
        if: inputs.qualification == 'linux-owner'
        env:
          RESTORE_REQUESTED: ${{ needs.snapshot-inputs.outputs.restore-requested }}
          EXPECTED_SNAPSHOT_ID: ${{ inputs.native-snapshot-id }}
          EXPECTED_SNAPSHOT_PARTITION: ${{ inputs.native-snapshot-partition }}
        run: |
          snapshot_args=()
          if [ "$RESTORE_REQUESTED" = true ]; then
            snapshot_args=(--snapshot "$RUNNER_TEMP/forge-linux-supplied-snapshot" --snapshot-id "$EXPECTED_SNAPSHOT_ID" --snapshot-partition "$EXPECTED_SNAPSHOT_PARTITION")
          fi
          python3 -B tools/compact-rust-backend/run_native_ci_forge.py \
            --compiler "$COMPACTC" --qualification-dir "$LINUX_REPORT" \
            --proof-runner "$LINUX_PROOF_RUNNER" --helper "$FORGE_HELPER" \
            --output "$RUNNER_TEMP/forge-linux-single-owner" "${snapshot_args[@]}"
      - name: Prepare official seed only after genuine native gates
        id: seed-prepare
        if: inputs.native-seed-publish && steps.native-owner.outcome == 'success'
        env:
          SEED_WINDOW: ${{ inputs.native-seed-window }}
        run: |
          python3 -B tools/compact-rust-backend/prepare_native_seed.py \
            --plan "$RUNNER_TEMP/forge-linux-single-owner/native-plan" \
            --snapshot "$RUNNER_TEMP/forge-linux-supplied-snapshot" \
            --approval "$SEED_WINDOW" --prepared "$RUNNER_TEMP/native-seed-prepared.json" \
            --window "$RUNNER_TEMP/native-seed-window.json"
      - name: Admit and publish one measured official seed archive
        if: inputs.native-seed-publish && steps.seed-prepare.outcome == 'success'
        uses: ./artifacts/forge-seed-publisher/.github/actions/native-seed-publish
        with:
          enabled: 'true'
          prepared: ${{ runner.temp }}/native-seed-prepared.json
          key: ${{ runner.temp }}/forge-linux-single-owner/native-plan/key.json
          window: ${{ runner.temp }}/native-seed-window.json
          output: ${{ runner.temp }}/native-seed-publication.json
          github-token: ${{ github.token }}
          binary: ${{ env.FORGE }}
          cache-dir: ${{ runner.temp }}/forge-linux-single-owner/native-plan/cache
          baseline: ${{ runner.temp }}/forge-linux-single-owner/native-plan/baseline.json
          compact-guard: ${{ github.workspace }}/tools/compact-rust-backend/prepare_native_seed.py
          compact-plan: ${{ runner.temp }}/forge-linux-single-owner/native-plan
      # Supplied restore remains read-only; publication is an explicit fixed-ref pilot.
      - name: Retain original Linux qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-seed-*.json
            ${{ runner.temp }}/forge-linux-provision/*.json
            ${{ runner.temp }}/forge-linux-qualification/*.json
            ${{ runner.temp }}/forge-linux-qualification/*.log
            ${{ runner.temp }}/forge-linux-value-loop/*.json
            ${{ runner.temp }}/forge-linux-single-owner/*.json
            ${{ runner.temp }}/forge-linux-single-owner/native-plan/*.json
            ${{ runner.temp }}/forge-linux-native/*.json
            ${{ runner.temp }}/forge-linux-native/*.stdout
            ${{ runner.temp }}/forge-linux-native/*.stderr
            ${{ runner.temp }}/forge-linux-native/cold/*.json
            ${{ runner.temp }}/forge-linux-native/cold/events/*.json
            ${{ runner.temp }}/forge-linux-native/restored/*.json
            ${{ runner.temp }}/forge-linux-native/restored/events/*.json
          if-no-files-found: warn
          retention-days: 7
