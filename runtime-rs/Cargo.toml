[package]
name = "midnight-compact-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Native Compact semantics on Midnight ledger primitives"
repository = "https://github.com/MediaNoxLabs/compact"
homepage = "https://github.com/MediaNoxLabs/compact"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "compatibility.json", "src/**", "tests/**"]

[features]
# Opt-in prototype; no default emitter or runtime behavior changes.
experimental-functional = []
ledger-transaction = ["dep:midnight-ledger-v9", "dep:rand"]

[dependencies]
ff = { version = "=0.13.1", default-features = false }
midnight-compact-runtime-macros = { version = "=0.2.0", path = "../runtime-rs-macros" }
midnight-base-crypto = { version = "=1.1.1" }
midnight-coin-structure = { version = "=3.0.1" }
midnight-onchain-runtime = { version = "=4.0.1" }
midnight-onchain-state = { version = "=4.0.1" }
midnight-onchain-vm = { version = "=4.0.1" }
midnight-serialize = { version = "=1.2.1" }
midnight-storage = { version = "=3.0.0" }
midnight-storage-core = { version = "=1.2.3" }
midnight-transient-crypto = { version = "=3.0.1" }

midnight-circuits = { version = "=7.3.0" }
midnight-curves = { version = "=0.3.1" }
midnight-proofs = { version = "=0.8.2" }
midnight-zk-stdlib = { version = "=2.4.0" }
midnight-zswap = { version = "=9.0.1" }
midnight-ledger-v9 = { version = "=1.0.1", optional = true }
rand = { version = "=0.8.6", optional = true }
sha2 = "=0.10.9"
sha3 = "=0.10.8"

[dev-dependencies]
hex = "0.4"
midnight-ledger-v9 = "=1.0.1"
serde = "1"
serde_json = "1"
