[workspace]
[package]
name = "secp256k1-funded-slow"
version = "0.0.0"
edition = "2024"

[dependencies]
address_contract = { package = "compact-contract-secp256k1-prove-ethereum-address", path = "../../emitted/prove_ethereum_address/.build/contract", features = ["ledger-transaction"] }
sequential = { package = "compact-contract-secp256k1-verify-sequential", path = "../../emitted/verify_sequential/.build/contract", features = ["ledger-transaction"] }
hex = "=0.4.3"
serde_json = "1"
midnight-base-crypto = "=1.1.1"
midnight_ledger = { package = "midnight-ledger-v9", version = "=1.0.1", features = ["test-utilities", "proving"] }
midnight-onchain-state = "=4.0.1"
midnight-serialize = "=1.2.1"
midnight-storage = "=3.0.0"
midnight-transient-crypto = "=3.0.1"
midnight-zkir = "=3.2.0"
midnight-zswap = "=9.0.1"
rand = "=0.8.6"
tokio = { version = "=1.50.0", features = ["rt", "time", "net"] }

[[bin]]
name = "secp256k1-funded-slow"
path = "main.rs"
