[workspace]
[package]
name = "secp256r1-funded-fields"
version = "0.0.0"
edition = "2024"

[dependencies]
base = { package = "compact-contract-secp256r1-base-roundtrip", path = "../../family-certified/base/roundtrip/ts-rust/.build/contract", features = ["ledger-transaction"] }
controls = { package = "compact-contract-field-defaults", path = "../../family-certified/controls/ts-rust/.build/contract", features = ["ledger-transaction"] }
hex = "=0.4.3"
serde_json = "1"
midnight-base-crypto = "=1.1.1"
midnight_ledger = { package = "midnight-ledger-v9", version = "=1.0.1", features = ["test-utilities", "proving"] }
midnight-onchain-state = "=4.0.1"
midnight-serialize = "=1.2.1"
midnight-storage = "=3.0.0"
midnight-transient-crypto = "=3.0.1"
midnight-zkir = "=3.2.0"
midnight-zswap = "=9.0.1"
rand = "=0.8.6"
tokio = { version = "=1.50.0", features = ["rt", "time", "net"] }

[[bin]]
name = "secp256r1-funded-fields"
path = "main.rs"

[features]
wrong-field = []

[[bin]]
name = "wrong-field"
path = "wrong-field.rs"
required-features = ["wrong-field"]
test = false
