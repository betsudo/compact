[workspace]
[package]
name = "secp256r1-funded-casts"
version = "0.0.0"
edition = "2024"

[dependencies]
group_computed = { package = "compact-contract-upstream-computed", path = "../../family-first/accessors/upstream-computed/ts-rust/.build/contract", features = ["ledger-transaction"] }
group_guarded = { package = "compact-contract-guarded", path = "../../family-first/group/guarded/ts-rust/.build/contract", features = ["ledger-transaction"] }
accessor_roundtrip = { package = "compact-contract-upstream-roundtrip", path = "../../family-first/point/upstream-roundtrip/ts-rust/.build/contract", features = ["ledger-transaction"] }
accessor_direct = { package = "compact-contract-upstream-direct", path = "../../family-first/accessors/upstream-direct/ts-rust/.build/contract", features = ["ledger-transaction"] }
accessor_ledger = { package = "compact-contract-upstream-ledger", path = "../../family-first/accessors/upstream-ledger/ts-rust/.build/contract", features = ["ledger-transaction"] }
accessor_asserted = { package = "compact-contract-upstream-asserted", path = "../../family-first/accessors/upstream-asserted/ts-rust/.build/contract", features = ["ledger-transaction"] }
accessor_guarded = { package = "compact-contract-guarded-writes", path = "../../family-first/accessors/guarded-writes/ts-rust/.build/contract", features = ["ledger-transaction"] }
point_equality = { package = "compact-contract-upstream-equality", path = "../../family-first/point/upstream-equality/ts-rust/.build/contract", features = ["ledger-transaction"] }
point_identity = { package = "compact-contract-upstream-identity", path = "../../family-first/point/upstream-identity/ts-rust/.build/contract", features = ["ledger-transaction"] }
unary_base = { package = "compact-contract-upstream-base", path = "../../family-first/unary/upstream-base/ts-rust/.build/contract", features = ["ledger-transaction"] }
unary_scalar = { package = "compact-contract-upstream-scalar", path = "../../family-first/unary/upstream-scalar/ts-rust/.build/contract", features = ["ledger-transaction"] }
unary_controls = { package = "compact-contract-unary-controls", path = "../../family-first/unary/unary-controls/ts-rust/.build/contract", features = ["ledger-transaction"] }
arithmetic = { package = "compact-contract-arithmetic", path = "../../family-first/arithmetic/ts-rust/.build/contract", features = ["ledger-transaction"] }
decode = { package = "compact-contract-decode", path = "../../family-first/casts/decode/ts-rust/.build/contract", features = ["ledger-transaction"] }
encode = { package = "compact-contract-encode", path = "../../family-first/casts/encode/ts-rust/.build/contract", features = ["ledger-transaction"] }
guarded_save = { package = "compact-contract-guarded-save", path = "../../family-first/casts/guarded-save/ts-rust/.build/contract", features = ["ledger-transaction"] }
guarded_decode = { package = "compact-contract-guarded-decode", path = "../../family-first/casts/guarded-decode/ts-rust/.build/contract", features = ["ledger-transaction"] }
guarded_encode = { package = "compact-contract-guarded-encode", path = "../../family-first/casts/guarded-encode/ts-rust/.build/contract", features = ["ledger-transaction"] }
constant = { package = "compact-contract-constant", path = "../../family-first/casts/constant/ts-rust/.build/contract", features = ["ledger-transaction"] }
unused = { package = "compact-contract-unused", path = "../../family-first/casts/unused/ts-rust/.build/contract", features = ["ledger-transaction"] }
hex = "=0.4.3"
serde_json = "1"
midnight-base-crypto = "=1.1.1"
midnight_ledger = { package = "midnight-ledger-v9", version = "=1.0.1", features = ["test-utilities", "proving"] }
midnight-onchain-state = "=4.0.1"
midnight-serialize = "=1.2.1"
midnight-storage = "=3.0.0"
midnight-transient-crypto = "=3.0.1"
midnight-zkir = "=3.2.0"
midnight-zswap = "=9.0.1"
rand = "=0.8.6"
tokio = { version = "=1.50.0", features = ["rt", "time", "net"] }

[[bin]]
name = "secp256r1-funded-casts"
path = "main.rs"
