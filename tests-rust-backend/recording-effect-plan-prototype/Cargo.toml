[package]
name = "compact-rust-recording-effect-plan-prototype-fixture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "lib.rs"

[features]
default = []
# Retained switch enables this test cohort; compiler admission is now default.
experimental-recording-plan = [
    "dep:compact-rust-backend",
    "dep:serde_json",
]
ledger-transaction = ["midnight-compact-runtime/ledger-transaction"]

[dependencies]
midnight-compact-runtime = { path = "../../runtime-rs" }

[build-dependencies]
compact-rust-backend = { path = "../../tools/compact-rust-backend", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
midnight-onchain-state = "=4.0.1"
midnight-serialize = "=1.2.1"
midnight-storage = "=3.0.0"
