[workspace]
[package]
name="isolated-functional-sdk-consumer"
version="0.0.0"
edition="2024"
[dependencies]
contract={package="compact-contract-field-witness-proof",path="../generated/contract"}
midnight-compact-testkit={path="../testkit-rs"}

sha2="=0.10.9"

midnight-ledger={version="=8.1.3",features=["proving", "test-utilities"],git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-zswap={version="=8.1.3",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-base-crypto={version="=1.0.2",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-onchain-state={version="=3.0.2",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-onchain-runtime={version="=3.1.2",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-storage={version="=2.0.3",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-serialize={version="=1.1.1",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
midnight-transient-crypto={version="=2.1.1",git="https://github.com/midnightntwrk/midnight-ledger",rev="b5d3e965a18e4cac17fac4f38446fc55c524439a",optional=true}
rand={version="=0.8.6",optional=true}
futures-executor={version="=0.3.32",optional=true}
tokio={version="=1.50.0",features=["rt"],optional=true}
serde_json={version="1",optional=true}
hex={version="0.4",optional=true}

[features]
proof=["contract/ledger-transaction", "midnight-compact-testkit/proof", "dep:midnight-ledger", "dep:midnight-zswap", "dep:midnight-base-crypto", "dep:midnight-onchain-state", "dep:midnight-onchain-runtime", "dep:midnight-storage", "dep:midnight-serialize", "dep:midnight-transient-crypto", "dep:rand", "dep:futures-executor", "dep:tokio", "dep:serde_json", "dep:hex"]

witness_result_negative=[]
witness_result_positive=[]
consumed_program_negative=[]
consumed_program_positive=[]
consumed_context_negative=[]
consumed_context_positive=[]

[[bin]]
name='witness_result_negative'
path='controls/witness_result_negative.rs'
required-features=['witness_result_negative']

[[bin]]
name='witness_result_positive'
path='controls/witness_result_positive.rs'
required-features=['witness_result_positive']

[[bin]]
name='consumed_program_negative'
path='controls/consumed_program_negative.rs'
required-features=['consumed_program_negative']

[[bin]]
name='consumed_program_positive'
path='controls/consumed_program_positive.rs'
required-features=['consumed_program_positive']

[[bin]]
name='consumed_context_negative'
path='controls/consumed_context_negative.rs'
required-features=['consumed_context_negative']

[[bin]]
name='consumed_context_positive'
path='controls/consumed_context_positive.rs'
required-features=['consumed_context_positive']

[[bin]]
name="functional-sdk-proof"
path="proof/prove.rs"
required-features=["proof"]

[profile.proof-checks]
inherits="dev"
debug=0
debug-assertions=true
overflow-checks=true

[profile.proof-checks.package."*"]
opt-level=3
