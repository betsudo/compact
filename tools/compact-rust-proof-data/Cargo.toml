[package]
name = "compact-rust-proof-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
[[bin]]
name = "produce"
path = "src/bin/produce.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"
[dependencies]
midnight-zkir = { version = "=3.2.1", git = "https://github.com/betsudo/midnight-zkir", rev = "3377ad9e48741f60e0aa17010b6f23e34223d906" }
midnight-transient-crypto = { version = "=3.1.0", git = "https://github.com/betsudo/midnight-ledger", rev = "6fbc2e3900845a858f70eebf8a0deab1d4d3c0d6" }
midnight-serialize = { version = "=1.2.1", git = "https://github.com/betsudo/midnight-ledger", rev = "6fbc2e3900845a858f70eebf8a0deab1d4d3c0d6" }
midnight-proofs = { version = "=0.8.2", git = "https://github.com/betsudo/midnight-zk", rev = "bca8db4d9e2c1ecaa5d1db5ba7a201935b6c6c8a" }
midnight-zk-stdlib = { version = "=2.4.0", git = "https://github.com/betsudo/midnight-zk", rev = "bca8db4d9e2c1ecaa5d1db5ba7a201935b6c6c8a" }
rand = "=0.8.6"
futures-executor = "=0.3.32"
serde_json = "=1.0.149"
sha2 = "=0.10.9"
anyhow = "=1.0.103"
libc = "=0.2.189"

serde = { version = "=1.0.228", features = ["derive"] }
midnight-curves = { version = "=0.3.1", git = "https://github.com/betsudo/midnight-zk", rev = "bca8db4d9e2c1ecaa5d1db5ba7a201935b6c6c8a" }
